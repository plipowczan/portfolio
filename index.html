<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The body-font preload is injected by the `preload-body-font` plugin in
      vite.config.js, not declared here: the font is fingerprinted at build
      time, so its filename is not knowable until the bundle exists.
    -->
    <!-- Page title and description are owned solely by
         src/components/seo/SEO.jsx. Declaring either here too would ship two of
         them on every page, and a parser taking the first would read one value
         for the whole domain. Do not reintroduce them.

         The title used to be safe here because react-helmet-async overwrote the
         text of this element. React 19 hoists a new <title> instead of editing
         this one, so a static tag would survive as a duplicate — and the
         prerenderer would bake both into every generated file. -->
    <script>
      (function () {
        var inject = function () {
          var clickRankAi = document.createElement("script");
          clickRankAi.src =
            "https://js.clickrank.ai/seo/df01ba8d-6fb3-4b8b-af78-4ea45be7de41/script?" +
            new Date().getTime();
          clickRankAi.async = true;
          document.head.appendChild(clickRankAi);
        };
        if ("requestIdleCallback" in window) {
          requestIdleCallback(inject, { timeout: 3000 });
        } else {
          setTimeout(inject, 2000);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
