<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Client-specific styles */
      p,
      table,
      td,
      div,
      a {
        font-family: "Inter", Arial, Helvetica, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Email Signature Start -->
    <table
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        font-family: &quot;Inter&quot;, Arial, Helvetica, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #1f2937;
        margin: 0;
        padding: 0;
      "
    >
      <tr>
        <!-- Avatar Column -->
        <td style="padding-right: 20px; vertical-align: top; width: 100px">
          <img
            src="images/avatar.jpg"
            alt="Pawel Lipowczan"
            width="100"
            height="100"
            style="
              border-radius: 50%;
              display: block;
              object-fit: cover;
              width: 100px;
              height: 100px;
              border: 2px solid #00ff9d;
            "
          />
        </td>

        <!-- Info Column -->
        <td
          style="
            vertical-align: top;
            border-left: 3px solid #00ff9d;
            padding-left: 20px;
          "
        >
          <div
            style="
              font-weight: 700;
              font-size: 18px;
              color: #111827;
              letter-spacing: -0.5px;
              margin-bottom: 2px;
            "
          >
            Pawel Lipowczan
          </div>

          <div
            style="
              color: #00b8ff;
              font-weight: 600;
              font-size: 14px;
              margin-bottom: 12px;
              text-transform: uppercase;
              letter-spacing: 0.5px;
            "
          >
            Twój Przewodnik Technologiczny
          </div>

          <table cellpadding="0" cellspacing="0" border="0" style="width: 100%">
            <tr>
              <td style="padding-bottom: 4px">
                <span
                  style="color: #00ff9d; font-weight: bold; margin-right: 6px"
                  >E:</span
                >
                <a
                  href="mailto:pawel@lipowczan.pl"
                  style="
                    color: #1f2937;
                    text-decoration: none;
                    border-bottom: 1px dotted #9ca3af;
                  "
                  >pawel@lipowczan.pl</a
                >
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 12px">
                <span
                  style="color: #00ff9d; font-weight: bold; margin-right: 6px"
                  >W:</span
                >
                <a
                  href="https://pawel.lipowczan.pl"
                  style="
                    color: #1f2937;
                    text-decoration: none;
                    border-bottom: 1px dotted #9ca3af;
                  "
                  >pawel.lipowczan.pl</a
                >
              </td>
            </tr>
          </table>

          <!-- Social Links (using images for compatibility) -->
          <div style="padding-top: 4px">
            <a
              href="https://linkedin.com/in/pawellipowczan"
              style="
                text-decoration: none;
                display: inline-block;
                margin-right: 12px;
              "
            >
              <!-- LinkedIn Icon -->
              <img
                src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png"
                alt="LinkedIn"
                width="20"
                height="20"
                style="display: block; opacity: 0.8"
              />
            </a>
            <a
              href="https://github.com/plipowczan"
              style="text-decoration: none; display: inline-block"
            >
              <!-- GitHub Icon -->
              <img
                src="https://cdn-icons-png.flaticon.com/512/3291/3291695.png"
                alt="GitHub"
                width="20"
                height="20"
                style="display: block; opacity: 0.8"
              />
            </a>
          </div>
        </td>
      </tr>
    </table>
    <!-- Email Signature End -->
  </body>
</html>
