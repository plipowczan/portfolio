# 200IQ LABS — Cash Flow 2026
# Tracking timing płatności + financing activities (oddzielnie od P&L).
#
# Sekcje:
#   financing          — equity issuance, shareholder loans, grants
#                        (NIE są revenue — zmiana struktury kapitału)
#   accruals_payments  — planowane płatności zaległych zobowiązań
#                        (cross-ref do accrued-liabilities.yaml)
#
# Status financing event:
#   confirmed — podpisane dokumenty / pewne; wliczane do bazowego forecast
#   planned   — intencja; opcjonalnie scenariusz "z/bez"
#   realized  — faktycznie zrealizowane (cash wpłynął/wypłynął)

year: 2026

financing:

  # ---- Pożyczki wspólników (zrealizowane) ----
