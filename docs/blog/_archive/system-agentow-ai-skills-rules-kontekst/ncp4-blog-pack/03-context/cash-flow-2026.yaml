    type: shareholder_loan
    amount: 10000
    currency: PLN
    lender: "Paweł Lipowczan"
    status: realized
    reference: "Umowa pożyczki z dnia 2026-02-18"
    note: ""

  - date: 2026-03-02
    type: shareholder_loan
    amount: 10000
    currency: PLN
    lender: "Paweł Lipowczan"
