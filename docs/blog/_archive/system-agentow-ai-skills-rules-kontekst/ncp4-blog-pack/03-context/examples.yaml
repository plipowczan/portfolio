# 200IQ LABS — Few-Shot Examples for LLM Classification
# Używane jako few-shot prompt dla LLM w PHASE 2 fallback (gdy żadna reguła nie matchuje).
#
# Każdy example:
#   transaction:    surowa transakcja (jak z PULL)
#   classification: oczekiwana klasyfikacja
#   reasoning:      uzasadnienie (LLM ma uczyć się WZORCÓW, nie tylko wartości)
#
# Cel: LLM widzi 5-10 reprezentatywnych przykładów per kategoria i przy nowej
# transakcji proponuje klasyfikację z polem `reasoning` (które user widzi w REVIEW).

examples:

