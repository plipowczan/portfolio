# 200IQ LABS — Classification Rules
# Deterministyczne reguły pattern-matching dla auto-klasyfikacji transakcji.
# Stosowane w PHASE 2 (CLASSIFY) before LLM fallback.
#
# Format reguły:
#   - id              — unikatowy identyfikator (kebab-case)
#     pattern:        — co matchować (memo / merchant / amount / source)
#       memo: "..."           — substring match (case-insensitive) lub regex
#       merchant: "..."       — exact lub regex
#       source: "..."         — revolut | stripe | infakt | tech-stack | accrual
#       amount_range: [a, b]  — opcjonalnie zakres kwoty
#     classify:
#       category: "opex/..."
#       unit: "qamera"        — opcjonalnie ('qamera' | '200iq' | null)
#     note: "..."             — uzasadnienie reguły (dlaczego)
#     created_at: YYYY-MM-DD
#
# Konflikt reguł (dwie matchują tę samą transakcję) → CLASSIFY raportuje
# do REVIEW i wymaga ręcznej decyzji. Priorytet: bardziej specyficzne wygrywa.

